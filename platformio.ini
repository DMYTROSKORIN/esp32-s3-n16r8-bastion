[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/embed_portal.py
lib_deps =
    esphome/wireguard @ 0.4.6
    https://github.com/ewpa/LibSSH-ESP32.git#34ada39c55c6169054af99355bb8e28e9c1527bc

; ESP32-S3 N16R8: 16 MB QIO flash + 8 MB Octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_WIREGUARD_MAX_SRC_IPS=8

monitor_speed = 115200
