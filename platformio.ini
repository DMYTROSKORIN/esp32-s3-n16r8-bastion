; ESP32-S3-N16R8 Bastion - build configuration.
;
; Target module: ESP32-S3 with 16 MB quad-SPI flash (QIO, 80 MHz) and 8 MB
; octal PSRAM (OPI). The N16R8 designation is exactly that combination; the
; board definition and partition settings below are specific to it. Other
; ESP32-S3 modules (N8R2, N16R2, N8 ...) are not supported by this
; configuration.
;
; The environment builds the ESP-IDF libraries from source with a custom
; sdkconfig (pioarduino "HybridCompile"): that is the only way to raise lwIP's
; TCP window above the 5760 bytes hard-wired into the prebuilt Arduino core,
; enable mbedTLS locking for concurrent SSH sessions, and so on (see
; docs/recovery-access-architecture.md). The first build compiles the whole IDF
; and takes 10-20 minutes; later builds reuse the cached libraries until
; custom_sdkconfig changes. The platform detects a change through a hash it
; stores in the first line of the generated sdkconfig.defaults; after editing
; custom_sdkconfig delete sdkconfig.defaults (and sdkconfig.esp32-s3-n16r8 if
; present) so the libraries are rebuilt from the new settings. Never edit
; platformio.ini while a build is running: the hash is refreshed mid-build
; while the libraries were already compiled from the old settings.

[platformio]
default_envs = esp32-s3-n16r8

[common]
lib_deps =
    esphome/wireguard @ 0.4.6
    https://github.com/ewpa/LibSSH-ESP32.git#34ada39c55c6169054af99355bb8e28e9c1527bc
build_unflags = -Os
build_flags =
    -O2
    -DCONFIG_WIREGUARD_MAX_SRC_IPS=8
    -DFIRMWARE_VERSION=\"1.4.2\"
    ; GitHub repository whose Releases the daily update check looks at
    ; (owner/name). Forks point this at themselves.
    -DOTA_GITHUB_REPO=\"DMYTROSKORIN/esp32-s3-n16r8-bastion\"
    ; Optional switches:
    ;   -DBASTION_WIFI_POWER_SAVE=1     keep Wi-Fi modem-sleep (lower power,
    ;                                   higher latency; see docs/device-behavior.md)
    ;   -DBASTION_STACK_DIAG            log task stack headroom after each session
    ;   -DBASTION_TEST_BREAK_SELFTEST   build an image that fails its OTA self-test
    ;                                   (for exercising the rollback path)

[env:esp32-s3-n16r8]
; pioarduino platform release 55.03.312 = Arduino core 3.3.12 on ESP-IDF 5.5.5,
; pioarduino core 6.2.0 / SCons 4.11.1 (the 55.03.311 + core 6.1.19 pairing
; broke on 2026-09-15 when pioarduino 6.2.0 reached PyPI, see build.yml).
; Pinned by URL: the platform decides which core, IDF and toolchain get used.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
; pioarduino ships an exact N16R8 board definition: 16 MB QIO flash @ 80 MHz,
; OPI PSRAM (qio_opi), 240 MHz, default_16MB.csv, BOARD_HAS_PSRAM.
board = esp32-s3-devkitc1-n16r8
framework = arduino
extra_scripts = pre:scripts/embed_portal.py
lib_deps = ${common.lib_deps}
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    ; LibSSH-ESP32 ships its own reference X25519 (external/curve25519_ref.c,
    ; unguarded) and libsodium - pulled in by esphome/wireguard - exports the
    ; same NaCl-API symbols crypto_scalarmult/crypto_scalarmult_base. With
    ; this toolchain both objects end up on the link line; both are correct,
    ; interchangeable X25519 implementations, so the duplicate is tolerated.
    -Wl,--allow-multiple-definition
board_upload.maximum_size = 6553600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; sdkconfig overrides. Everything not listed keeps pioarduino's defaults for
; this chip (which already include PSRAM in octal mode, hardware AES/SHA/MPI,
; SACK and a 4 KB tcpip_thread stack).
custom_sdkconfig =
    ; --- TCP: the throughput ceiling of the whole device ---
    ; Bytes a single connection may have in flight. 5760 (the prebuilt core)
    ; capped a session at ~5760 B per round-trip: ~160 KB/s on the LAN, well
    ; under 200 KB/s through WireGuard. 32 KB is 22 full segments; rx pbufs
    ; come from PSRAM (SPIRAM_TRY_ALLOCATE_WIFI_LWIP), so the cost in internal
    ; RAM is negligible for the <= 4 sockets this firmware opens.
    CONFIG_LWIP_TCP_WND_DEFAULT=32768
    CONFIG_LWIP_TCP_SND_BUF_DEFAULT=32768
    ; Segments the socket layer may queue before the reader drains them; the
    ; default 6 was sized for a 4-segment window.
    CONFIG_LWIP_TCP_RECVMBOX_SIZE=32
    CONFIG_LWIP_TCP_SACK_OUT=y
    ; WireGuard setup (X25519 on netif_add) and the ARP scan now run on the
    ; lwIP thread; give it real headroom instead of the Arduino default 2560.
    CONFIG_LWIP_TCPIP_TASK_STACK_SIZE=6144
    ; --- Wi-Fi driver buffers: match the larger TCP window ---
    ; Static RX buffers are DMA-capable internal RAM (1.6 KB each); the
    ; dynamic RX pool and lwIP's pbufs go to PSRAM thanks to
    ; SPIRAM_TRY_ALLOCATE_WIFI_LWIP (off in pioarduino's default config, which
    ; is what pushed free internal heap down to ~116 KB in the first build).
    CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=12
    CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=64
    CONFIG_ESP_WIFI_STATIC_TX_BUFFER_NUM=16
    CONFIG_ESP_WIFI_RX_BA_WIN=24
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
    CONFIG_ESP_WIFI_AMPDU_TX_ENABLED=y
    CONFIG_ESP_WIFI_AMPDU_RX_ENABLED=y
    ; Hot Wi-Fi/lwIP paths in IRAM (the Arduino core leaves them in flash to
    ; save IRAM for Bluetooth, which this firmware never uses).
    CONFIG_ESP_WIFI_IRAM_OPT=y
    CONFIG_ESP_WIFI_RX_IRAM_OPT=y
    CONFIG_LWIP_IRAM_OPTIMIZATION=y
    ; IDF libraries at -O2 as well (default is -Os).
    CONFIG_COMPILER_OPTIMIZATION_PERF=y
    ; --- mbedTLS locking: required for concurrent SSH sessions ---
    ; libssh shares one CTR-DRBG (and mbedTLS shares its hardware crypto
    ; contexts) between all sessions; the build refuses to compile without it.
    CONFIG_MBEDTLS_THREADING_C=y
    CONFIG_MBEDTLS_THREADING_PTHREAD=y
    CONFIG_MBEDTLS_THREADING_ALT=n
    ; --- mbedTLS heap placement ---
    ; The IDF default pins every mbedTLS allocation to internal RAM, so one
    ; HTTPS request (the daily release check, `ota https://`) costs ~43 KB of
    ; the ~124 KB internal heap that Wi-Fi, lwIP and libssh compete for
    ; (measured 2026-09-22 on v1.4.1: min free heap 118 -> 75 KB after a
    ; single `ota check`). With the default allocator the 256 B threshold set
    ; in main.cpp applies to mbedTLS too: TLS record buffers and the parsed CA
    ; chain land in PSRAM, small contexts stay internal. libssh's packet
    ; buffers already live in PSRAM, so the hardware AES/SHA paths were
    ; exercised with external memory long before this change.
    CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=n
    CONFIG_MBEDTLS_DEFAULT_MEM_ALLOC=y
