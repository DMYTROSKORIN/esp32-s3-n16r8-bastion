; ESP32-S3-N16R8 Bastion - build configuration.
;
; Target module: ESP32-S3 with 16 MB quad-SPI flash (QIO, 80 MHz) and 8 MB
; octal PSRAM (OPI). The N16R8 designation is exactly that combination; the
; memory_type/partition settings below are specific to it. Other ESP32-S3
; modules (N8R2, N16R2, N8 ...) need a different memory_type and partition
; table and are not supported by this configuration.

[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
; Pinned: the platform decides which Arduino core / ESP-IDF / prebuilt lwIP
; and Wi-Fi libraries get linked in. Bumping it silently is how a reliable
; headless device stops booting after an innocent rebuild.
platform = espressif32 @ 7.0.1
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/embed_portal.py
lib_deps =
    esphome/wireguard @ 0.4.6
    https://github.com/ewpa/LibSSH-ESP32.git#34ada39c55c6169054af99355bb8e28e9c1527bc

; --- ESP32-S3-N16R8 hardware -------------------------------------------------
; 16 MB QIO flash @ 80 MHz + 8 MB Octal PSRAM @ 80 MHz, CPU at 240 MHz.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
; default_16MB.csv: two 6.25 MB OTA app slots (app0/app1), 3.4 MB SPIFFS for
; the SSH host key, a coredump partition, NVS at the standard 0x9000. The
; board's stock table (default_8MB.csv) would leave half the flash unused and
; give OTA slots too small for future growth.
board_build.partitions = default_16MB.csv
board_upload.maximum_size = 6553600

; --- Build ---------------------------------------------------------------------
; libssh, the WireGuard stack and the relay are compiled from source, so the
; optimisation level matters for crypto/packet throughput: -O2 instead of the
; Arduino default -Os. Flash is not a constraint on this module.
build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DCONFIG_WIREGUARD_MAX_SRC_IPS=8
    -DFIRMWARE_VERSION=\"1.0.0\"
    ; Optional switches:
    ;   -DBASTION_WIFI_POWER_SAVE=1   keep Wi-Fi modem-sleep (lower power,
    ;                                 higher latency; see docs/device-behavior.md)
    ;   -DBASTION_BENCH_ALL_CIPHERS   offer every libssh cipher (benchmarking only)
    ;   -DBASTION_STACK_DIAG          log task stack headroom after each session

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
