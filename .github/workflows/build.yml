name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: PlatformIO build (esp32-s3-n16r8)
    runs-on: ubuntu-latest
    # The default environment rebuilds the ESP-IDF libraries from source on
    # the first run (pioarduino HybridCompile); the cache below keeps that to
    # once per platformio.ini change.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages and rebuilt IDF libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.cache/pip
          # Exact key only: pioarduino's HybridCompile keeps the rebuilt IDF
          # libraries inside the package directory, and reusing a cache made
          # for a different platformio.ini (different custom_sdkconfig) sends
          # it down a "Reinstall Arduino framework" path that crashes. A
          # config change therefore costs one clean install (~10 min).
          key: pio-idf5-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO and signing dependencies
        # Pinned: pioarduino's HybridCompile step (rebuilding the IDF libraries
        # with the project's sdkconfig) fails under PlatformIO 6.2.0 with
        # "No module named 'SCons.Tool.FortranCommon'"; 6.1.19 is what the
        # firmware is built and tested with locally.
        run: pip install "platformio==6.1.19" cryptography

      - name: Build
        run: pio run -e esp32-s3-n16r8

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            ini=$(sed -n 's/.*-DFIRMWARE_VERSION=\\"\([^"\\]*\)\\".*/\1/p' platformio.ini | head -n1)
            echo "version=${ini}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign OTA image
        if: ${{ env.OTA_SIGNING_KEY != '' }}
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          python scripts/ota_sign.py sign \
            --version "${{ steps.version.outputs.version }}" \
            --in .pio/build/esp32-s3-n16r8/firmware.bin \
            --out .pio/build/esp32-s3-n16r8/firmware-signed.bin
          python scripts/ota_sign.py verify --header include/ota_public_key.h \
            --in .pio/build/esp32-s3-n16r8/firmware-signed.bin

      - name: Report size
        run: |
          ls -l .pio/build/esp32-s3-n16r8/firmware*.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: esp32-s3-n16r8-bastion-${{ github.sha }}
          path: |
            .pio/build/esp32-s3-n16r8/firmware.bin
            .pio/build/esp32-s3-n16r8/firmware-signed.bin
            .pio/build/esp32-s3-n16r8/bootloader.bin
            .pio/build/esp32-s3-n16r8/partitions.bin
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            .pio/build/esp32-s3-n16r8/firmware-signed.bin
            .pio/build/esp32-s3-n16r8/firmware.bin
            .pio/build/esp32-s3-n16r8/bootloader.bin
            .pio/build/esp32-s3-n16r8/partitions.bin
          body: |
            Signed OTA image: `firmware-signed.bin`. Install with
            `ssh <user>@<board> ota < firmware-signed.bin` or, from the console,
            `ota https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/firmware-signed.bin`.
            `firmware.bin` + `bootloader.bin` + `partitions.bin` are for a USB flash.
            See CHANGELOG.md for what changed.
